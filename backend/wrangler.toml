name = "ar-exporter"
main = "src/index.js"
compatibility_date = "2024-09-02"

# R2 — armazenamento dos arquivos USDZ
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "ar-exporter-files"

# D1 — banco de dados (arquivos, scans, tokens Pro)
[[d1_databases]]
binding     = "DB"
database_name = "ar-exporter-db"
database_id   = "COLE_O_ID_AQUI"   # preenchido após: wrangler d1 create ar-exporter-db

# Limpeza diária de arquivos expirados (2h da manhã UTC)
[triggers]
crons = ["0 2 * * *"]

# Variáveis de ambiente
[vars]
# ADMIN_SECRET é definido como secret (nunca no código):
#   wrangler secret put ADMIN_SECRET
